name: Build CVs
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Install deps
        run: |
          pip install pyyaml rendercv
          sudo apt-get update && sudo apt-get install -y pandoc texlive-xetex texlive-fonts-recommended lmodern fonts-ebgaramond tex-gyre || true

      - name: Regenerate from SSOT
        run: |
          python scripts/build_tagged.py --variant all
          python scripts/cv_to_rendercv.py
          python scripts/generate_timeline.py

      - name: Compile long union (LaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: industrial/long_union.tex
          working_directory: industrial
          args: -interaction=nonstopmode

      - name: Compile markdown resume (pandoc themes)
        run: python scripts/build_markdown_pdf.py

      - name: Render Typst via RenderCV (all variants)
        run: |
          for f in rendercv/Ali_Nikkhah_*.yaml; do rendercv render "$f" || true; done

      - name: Stage outputs
        run: |
          mkdir -p dist
          cp industrial/long_union.pdf dist/Ali_Nikkhah_Union.pdf 2>/dev/null || true
          cp markdown_resume/pdf/*.pdf dist/ 2>/dev/null || true
          cp -r rendercv_output dist/rendercv 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cvs
          path: |
            dist/**
            academic/themes/*.pdf

      - name: Deploy to gh-pages (CV gallery)
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          enable_jekyll: false
