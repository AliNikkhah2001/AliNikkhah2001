title: "Single & Multi-View Scale Estimation: Literature Review"
description: "Comprehensive survey of methods, models, datasets, and benchmarks for metric size estimation from images"
author: "Research Team"
github_username: "AliNikkhah2001"
repository: "size-scale-estimation"

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

collections:
  methods:
    output: true
    permalink: /methods/:name/
  datasets:
    output: true
    permalink: /datasets/:name/
  models:
    output: true
    permalink: /models/:name/

defaults:
  - scope:
      path: ""
      type: "methods"
    values:
      layout: "method"
  - scope:
      path: ""
      type: "datasets"
    values:
      layout: "dataset"
  - scope:
      path:
      type: "models"
    values:
      layout: "model"

navigation:
  - title: "Overview"
    url: /
  - title: "Methods"
    url: /methods/
  - title: "Models"
    url: /models/
  - title: "Datasets"
    url: /datasets/
  - title: "Benchmarks"
    url: /benchmarks/
  - title: "Applications"
    url: /applications/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE