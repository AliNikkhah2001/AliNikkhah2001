<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ali Nikkhah — CV Gallery</title>
<style>
:root { --fg:#1a1a1a; --muted:#666; --accent:#0e6eb0; --bg:#fafafa; --card:#fff; --border:#e5e5e5; }
* { box-sizing:border-box; }
body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--fg); }
header { padding:2rem 1.5rem; border-bottom:1px solid var(--border); background:var(--card); }
h1 { margin:0 0 .25rem; font-size:1.6rem; }
.sub { color:var(--muted); }
main { max-width:960px; margin:0 auto; padding:1.5rem; }
h2 { font-size:1.1rem; border-bottom:1px solid var(--border); padding-bottom:.5rem; margin-top:2rem; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:1rem; }
.card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:1rem; }
.card a { color:var(--accent); text-decoration:none; font-weight:600; }
.card .meta { color:var(--muted); font-size:.85rem; margin:.25rem 0 0; }
.footer { text-align:center; color:var(--muted); font-size:.85rem; padding:2rem 1.5rem; }
</style>
</head>
<body>
<header>
  <h1>Ali Nikkhah — CV Gallery</h1>
  <div class="sub">Auto-compiled on every commit from <code>data/cv.yaml</code> (single source of truth)</div>
</header>
<main>
  <h2>Union &amp; Markdown PDFs</h2>
  <div class="grid" id="union"></div>
  <h2>RenderCV (Typst) Variants</h2>
  <div class="grid" id="rendercv"></div>
</main>
<div class="footer">Generated by GitHub Actions · rendercv + pandoc + LaTeX</div>
<script>
fetch('manifest.json').then(r=>r.json()).then(m=>{
  const u=document.getElementById('union');
  (m.pdf||[]).forEach(f=>{u.insertAdjacentHTML('beforeend',`<div class="card"><a href="${f}">${f.split('/').pop()}</a><div class="meta">PDF</div></div>`)});
  const rc=document.getElementById('rendercv');
  (m.rendercv||[]).forEach(f=>{rc.insertAdjacentHTML('beforeend',`<div class="card"><a href="${f}">${f.split('/').pop()}</a><div class="meta">Typst PDF</div></div>`)});
}).catch(()=>{});
</script>
</body>
</html>
