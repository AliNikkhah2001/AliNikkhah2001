      location: Tehran, Iran — Full-time · On-site
      summary: Built the company's self-hosted Graph RAG assistant for credit-scoring
        analysts — Neo4j knowledge graph, GPU-resident open-weight LLM runtime and
        a tool-calling agent with grounded citations.
      highlights:
      - Architected a self-hosted Graph RAG assistant that fuses a Neo4j knowledge
        graph with FAISS vector retrieval into a LangGraph tool-calling agent, answering
        credit-scoring analysts' queries with grounded citations.
      - Ran open-weight LLMs on GPU via vLLM and TGI, profiling KV-cache, batching
        and AWQ/GPTQ quantization to cut per-token latency and GPU memory footprint.
      - Implemented Neo4j tool-calls inside the LangGraph agent — schema-aware Cypher
        generation and retrieval — so it executes real graph traversals instead of
        hallucinating structured credit facts.
      - Hardened the Graph RAG assistant for a regulated financial environment with
        retrieval grounding, citation enforcement and deterministic fallback, blocking
        unsupported answers before they reach analysts.
      - Shipped the assistant as a FastAPI service on Kubernetes with usage guides
        for credit-scoring analysts' daily workflow.
    - company: Trinity College Dublin — EmoDub Project
      position: Machine Learning Engineer — Emotion-Aware Speech Translation
      start_date: 2023-05
      end_date: 2024-04
      location: Dublin, Ireland — Part-time · Remote Work
      summary: Researched emotion-aware speech-to-speech translation for the EmoDub
        project, fusing speech-emotion-recognition transformers with wav2vec2.0 and
        Whisper to preserve prosody in translated output.
      highlights:
      - Trained a PyTorch SER front-end over wav2vec2.0 and Whisper to emit affect
        logits, then fused it with a cross-modal transformer for emotion-consistent
        translation decoding.
      - Curated the EmotionNet and EmoDB emotion-annotated corpora with balanced cultural
        representation, then defined the BLEU, Emotion F1 and MOS evaluation protocol.
      - 'Collaborated with Prof. Siobhán Clarke at Trinity College Dublin, delivering
        a reproducible PyTorch research codebase: https://github.com/AliNikkhah2001/emodub-emotion-translation.'
      - Diagnosed where emotion leaks out of translated speech by contrasting wav2vec2.0
        and Whisper embeddings against librosa prosody contours.
    - company: Sharif University — Robust & Interpretable ML Lab
      position: Research Collaborator — Explainable & Robust AI
      start_date: 2025-06
      end_date: 2025-08
      location: Tehran, Iran — Part-time · On-site
      summary: Built robustness and interpretability harnesses for multimodal perception
        models under distribution shift, benchmarking adversarial and natural shifts
        with Captum and SHAP attribution analysis.
      highlights:
      - Constructed adversarial and natural distribution-shift suites over PyTorch
        multimodal perception models, with Captum and SHAP notebooks surfacing attributions,
        saliency and counterfactuals.
      - Authored a regulated-industry deployment guide with lab faculty, codifying
        MLflow experiment tracking, interpretability evidence and rollout safeguards
        from the robustness harness.
      - Ranked model variants in a robustness leaderboard across shift types with
        documented failure cases for lab review.
    - company: University of British Columbia
      position: Research Assistant — Vision-Language Medical Imaging (Ultrasound Report
        Generation)
      start_date: 2024-02
      end_date: 2025-11
      location: Remote · Vancouver, Canada (Tehran-based) — Part-time · Remote Internship
        (10h/wk)
      summary: Part-time research assistant developing ViT/BLIP and T5 models for
        DICOM-compliant ultrasound report generation with contrastive pretraining
        and clinician-in-the-loop saliency.
      highlights:
      - Designed ViT/BLIP encoders paired with a T5 report generator, trained with
        contrastive and self-supervised alignment over curated DICOM and de-identified
        QA corpora in PyTorch.
      - Deployed attention and saliency overlays for interpretability, benchmarked
        BLEU/ROUGE-L and clinical efficacy with radiologists, and reached state-of-the-art
        accuracy on the in-house ultrasound split.
      - Drafted manuscript "Automated DICOM-Compliant Ultrasound Report Generation
        via Contrastive Vision-Language Learning" for arXiv (preprint in preparation,
        2025).
      - Ran CLIP-similarity pretraining ablations to pick the recipe before report-generation
        fine-tuning.
    - company: L3S Research Center — Leibniz University Hannover
      position: Research Assistant — Video Motion Classification
      start_date: 2023-05
      end_date: 2024-02
      location: Hannover, Germany — Part-time · Remote/On-site
      summary: Research assistant developing texture-free motion models from optical
        flow with 3D CNNs and transformers, with state-of-the-art results on UCF-101
        and HMDB-51.
      highlights:
      - Engineered optical-flow-centric video datasets with temporal sampling and
        augmentation, improving domain generalization across lighting, texture, and
        camera shifts using OpenCV and PyAV.
      - Benchmarked 3D CNN and transformer hybrids against baselines on UCF-101/HMDB-51,
        analyzing attention maps to curb overfitting and reach SOTA accuracy with
        PyTorch Lightning.
      - Built the ablation and cross-validation harness (splits, metric aggregation)
        used across all reported UCF-101/HMDB-51 experiments.
